# Caffeine JCache configuration for Hibernate L2 cache regions.
# Each Hibernate entity/collection/query cache region maps to one JCache cache name below.
# Interview talking point: read-heavy, rarely-changing reference data (Asset) benefits most from L2 cache;
# high-churn entities like TradeOrder/Transaction are intentionally NOT cached here.

# Asset entity cache (read-heavy reference/master data)
com.interview.portfolio.entity.Asset.maximumSize=5000
com.interview.portfolio.entity.Asset.expireAfterWriteSeconds=3600

com.interview.portfolio.entity.EquityAsset.maximumSize=5000
com.interview.portfolio.entity.EquityAsset.expireAfterWriteSeconds=3600

com.interview.portfolio.entity.FixedIncomeAsset.maximumSize=5000
com.interview.portfolio.entity.FixedIncomeAsset.expireAfterWriteSeconds=3600

# Query cache region used by cacheable JPQL/EntityGraph lookups on assets
query-results-region.maximumSize=2000
query-results-region.expireAfterWriteSeconds=1800

# Update timestamps cache required by Hibernate query cache invalidation
default-update-timestamps-region.maximumSize=5000
